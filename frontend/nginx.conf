# Serve pre-built static assets compressed (Lighthouse: uses-text-compression).
gzip on;
gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
gzip_min_length 1024;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — React Router routes serve the same index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse-proxy the API to the backend compose service.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Keep small assets for a year.
  location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
