[tool.poetry]
name = "booking-service-backend"
version = "0.1.0"
description = "Backend for 'Запись на звонок' booking service (v1, in-memory)."
authors = ["Hexlet"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
django = ">=6.0,<7.0"
django-ninja = ">=1.5,<2.0"
django-cors-headers = ">=4.6,<5.0"
pydantic = {version = ">=2.9,<3.0", extras = ["email"]}
gunicorn = ">=23.0,<24.0"
uvicorn = {version = ">=0.32,<1.0", extras = ["standard"]}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-django = "^4.9"
ruff = "^0.6"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
